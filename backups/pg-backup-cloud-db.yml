services:
  backup-cloud-db:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        apk add --no-cache \
          bash \
          postgresql17-client \
          coreutils \
          mailx \
          msmtp \
          ca-certificates

        # Configure msmtp
        cat > /etc/msmtprc <<EOF
        defaults
        auth off
        tls off

        account default
        host mail
        port 25
        from $CLOUD_PG_BACKUP_MAIL_FROM
        EOF

        chmod 600 /etc/msmtprc

        # Configure mailx
        echo 'set sendmail="/usr/bin/msmtp"' > /etc/mail.rc

        apk add --no-cache su-exec
        exec su-exec "$PUID:$PGID" /bin/bash /scripts/backup.sh

    environment:
      # PG Backup
      PG_BACKUP_SYNC_DIR: ${PG_BACKUP_SYNC_DIR}
      PG_BACKUP_SCRIPT_DIR: ${PG_BACKUP_SCRIPT_DIR}
      # PG Mail
      CLOUD_PG_BACKUP_MAIL_FROM: ${CLOUD_PG_BACKUP_MAIL_FROM}
      CLOUD_PG_BACKUP_MAIL_TO: ${CLOUD_PG_BACKUP_MAIL_TO}
      # PG Server
      CLOUD_PG_BACKUP_HOST: ${CLOUD_PG_BACKUP_HOST}
      CLOUD_PG_BACKUP_PORT: ${CLOUD_PG_BACKUP_PORT}
      # PG Admin
      CLOUD_PG_BACKUP_ADMIN_DB: ${CLOUD_PG_BACKUP_ADMIN_DB}
      CLOUD_PG_BACKUP_ADMIN_USER: ${CLOUD_PG_BACKUP_ADMIN_USER}
      CLOUD_PG_BACKUP_ADMIN_PASSWORD: ${CLOUD_PG_BACKUP_ADMIN_PASSWORD}
      # Etherpad Cloud
      ETHERPAD_CLOUD_POSTGRES_DB: ${ETHERPAD_CLOUD_POSTGRES_DB}
      ETHERPAD_POSTGRES_USER: ${ETHERPAD_POSTGRES_USER}
      ETHERPAD_POSTGRES_PASSWORD: ${ETHERPAD_POSTGRES_PASSWORD}
      # Focalboard
      FOCALBOARD_POSTGRES_DB: ${FOCALBOARD_POSTGRES_DB}
      FOCALBOARD_POSTGRES_USER: ${FOCALBOARD_POSTGRES_USER}
      FOCALBOARD_POSTGRES_PASSWORD: ${FOCALBOARD_POSTGRES_PASSWORD}
      # Forgejo
      FORGEJO_POSTGRES_DB: ${FORGEJO_POSTGRES_DB}
      FORGEJO_POSTGRES_USER: ${FORGEJO_POSTGRES_USER}
      FORGEJO_POSTGRES_PASSWORD: ${FORGEJO_POSTGRES_PASSWORD}
      # GitLab
      GITLAB_POSTGRES_DB: ${GITLAB_POSTGRES_DB}
      GITLAB_POSTGRES_USER: ${GITLAB_POSTGRES_USER}
      GITLAB_POSTGRES_PASSWORD: ${GITLAB_POSTGRES_PASSWORD}
      # Grafana Cloud
      GF_CLOUD_POSTGRES_DB: ${GF_CLOUD_POSTGRES_DB}
      GF_POSTGRES_USER: ${GF_POSTGRES_USER}
      GF_POSTGRES_PASSWORD: ${GF_POSTGRES_PASSWORD}
      # Keycloak
      KC_POSTGRES_DB: ${KC_POSTGRES_DB}
      KC_POSTGRES_USER: ${KC_POSTGRES_USER}
      KC_POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
      # Listmonk
      LISTMONK_POSTGRES_DB: ${LISTMONK_POSTGRES_DB}
      LISTMONK_POSTGRES_USER: ${LISTMONK_POSTGRES_USER}
      LISTMONK_POSTGRES_PASSWORD: ${LISTMONK_POSTGRES_PASSWORD}
      # N8N
      N8N_POSTGRES_DB: ${N8N_POSTGRES_DB}
      N8N_POSTGRES_USER: ${N8N_POSTGRES_USER}
      N8N_POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      # Nextcloud Cloud
      NEXTCLOUD_CLOUD_POSTGRES_DB: ${NEXTCLOUD_CLOUD_POSTGRES_DB}
      NEXTCLOUD_POSTGRES_USER: ${NEXTCLOUD_POSTGRES_USER}
      NEXTCLOUD_POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      # Paperless
      PAPERLESS_CLOUD_POSTGRES_DB: ${PAPERLESS_CLOUD_POSTGRES_DB}
      PAPERLESS_POSTGRES_USER: ${PAPERLESS_POSTGRES_USER}
      PAPERLESS_POSTGRES_PASSWORD: ${PAPERLESS_POSTGRES_PASSWORD}
      # Penpot
      PENPOT_POSTGRES_DB: ${PENPOT_POSTGRES_DB}
      PENPOT_POSTGRES_USER: ${PENPOT_POSTGRES_USER}
      PENPOT_POSTGRES_PASSWORD: ${PENPOT_POSTGRES_PASSWORD}
      # Postiz
      POSTIZ_POSTGRES_DB: ${POSTIZ_POSTGRES_DB}
      POSTIZ_POSTGRES_USER: ${POSTIZ_POSTGRES_USER}
      POSTIZ_POSTGRES_PASSWORD: ${POSTIZ_POSTGRES_PASSWORD}
      # RxResume
      RXRESUME_POSTGRES_DB: ${RXRESUME_POSTGRES_DB}
      RXRESUME_POSTGRES_USER: ${RXRESUME_POSTGRES_USER}
      RXRESUME_POSTGRES_PASSWORD: ${RXRESUME_POSTGRES_PASSWORD}
      # Temporal
      TEMPORAL_POSTGRES_DB: ${TEMPORAL_POSTGRES_DB}
      TEMPORAL_POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
      # Vaultwarden
      VAULTWARDEN_CLOUD_POSTGRES_DB: ${VAULTWARDEN_CLOUD_POSTGRES_DB}
      VAULTWARDEN_POSTGRES_USER: ${VAULTWARDEN_POSTGRES_USER}
      VAULTWARDEN_POSTGRES_PASSWORD: ${VAULTWARDEN_POSTGRES_PASSWORD}

    volumes:
      - ${PG_BACKUP_SYNC_DIR}:/backups
      - ${PG_BACKUP_SCRIPT_DIR}/pg-backup-cloud-db.sh:/scripts/backup.sh:ro
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

networks:
  traefik-public:
    external: true
