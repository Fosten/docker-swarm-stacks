version: '3.9'

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    networks:
      - traefik-public
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ${HOME}/pgadmin/data:/var/lib/pgadmin
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_HOSTNAME}`)
        - traefik.http.services.pgadmin.loadbalancer.server.port=80
        - traefik.http.routers.pgadmin.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.pgadmin.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.pgadmin.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
