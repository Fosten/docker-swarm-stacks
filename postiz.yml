version: '3.9'

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      MAIN_URL: "https://${POSTIZ_HOSTNAME}"
      FRONTEND_URL: "https://${POSTIZ_HOSTNAME}"
      NEXT_PUBLIC_BACKEND_URL: "https://${POSTIZ_HOSTNAME}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      DATABASE_URL: "${POSTIZ_DATABASE_URL}"
      REDIS_URL: "${POSTIZ_REDIS_URL}"
      TEMPORAL_ADDRESS: "postiz-temporal:7233"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      - ${HOME}/postiz/config:/config
      - ${HOME}/postiz/uploads:/uploads
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.postiz.rule=Host(`${POSTIZ_HOSTNAME}`)
        - traefik.http.services.postiz.loadbalancer.server.port=5000
        - traefik.http.routers.postiz.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.postiz.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.postiz.tls.certresolver=mydnschallenge

  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: "${TEMPORAL_POSTGRES_PORT}"
      POSTGRES_SEEDS: "${TEMPORAL_POSTGRES_HOST}"
      POSTGRES_USER: "${TEMPORAL_POSTGRES_USER}"
      POSTGRES_PWD: "${TEMPORAL_POSTGRES_PASSWORD}"
      DBNAME: "${TEMPORAL_DATABASE}"
    networks:
      - traefik-postiz
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

  postiz-redis:
    image: redis:8.10.2
    networks:
      - traefik-postiz
    volumes:
      - ${HOME}/postiz/redis:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

networks:
  traefik-public:
    external: true
  traefik-postiz:
    driver: overlay