version: '3.9'

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    networks:
      - traefik-public
    volumes:
      - ${HOME}/audiobookshelf/audiobooks:/audiobooks
      - ${HOME}/audiobookshelf/podcasts:/podcasts
      - ${HOME}/audiobookshelf/metadata:/metadata
      - ${HOME}/audiobookshelf/config:/config
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.audiobookshelf.rule=Host(`${AUDIOBOOKSHELF_HOSTNAME}`)
        - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
        - traefik.http.routers.audiobookshelf.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.audiobookshelf.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.audiobookshelf.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
