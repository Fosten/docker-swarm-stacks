version: "3.9"

services:
  gotify:
    image: gotify/server:latest
    networks:
      - traefik-public
    volumes:
      - "${HOME}/gotify/gotify_data:/app/data"
    environment:
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_DEFAULTUSER_PASS}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.gotify.rule=Host(`${GOTIFY_HOSTNAME}`)
        - traefik.http.services.gotify.loadbalancer.server.port=80
        - traefik.http.routers.gotify.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.gotify.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.gotify.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
