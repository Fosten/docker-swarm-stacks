version: "3.9"

services:
  dozzle:
    image: amir20/dozzle:latest
    networks:
      - traefik-public
      - dozzle-mesh
    environment:
      DOZZLE_MODE: swarm
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_HOSTNAME: "{{.Node.Hostname}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: global
      endpoint_mode: dnsrr
      labels:
        - traefik.enable=true
        - traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOSTNAME}`)
        - traefik.http.services.dozzle.loadbalancer.server.port=8080
        - traefik.http.routers.dozzle.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.dozzle.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.dozzle.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
  dozzle-mesh:
    driver: overlay
    attachable: true
