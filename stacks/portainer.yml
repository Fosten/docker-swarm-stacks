services:
  portainer:
    image: portainer/portainer-ce:sts
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/portainer/data:/data
    networks:
      - traefik-public
      - portainer-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOSTNAME}`)
        - traefik.http.services.portainer.loadbalancer.server.port=9000
        - traefik.http.routers.portainer.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.portainer.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.portainer.tls.certresolver=mydnschallenge

  portainer-agent:
    image: portainer/agent:sts
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer-net
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      labels:
        - traefik.enable=false

networks:
  traefik-public:
    external: true
  portainer-net:
    driver: overlay
