version: '3.9'

services:
  penpot-frontend:
    image: penpotapp/frontend:latest
    networks:
      - traefik-public
      - penpot
    environment:
      PENPOT_PUBLIC_URI: https://${PENPOT_HOSTNAME}
      PENPOT_FLAGS: enable-login-with-oidc enable-oidc-registration
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_CLIENT_ID}
      PENPOT_OIDC_NAME: Keycloak
      # Don't touch it; this uses an internal docker network to
      # communicate with the admin-console.
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    volumes:
      - ${HOME}/penpot/assets:/opt/data/assets
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.penpot.rule=Host(`${PENPOT_HOSTNAME}`)
        - traefik.http.services.penpot.loadbalancer.server.port=8080
        - traefik.http.routers.penpot.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.penpot.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.penpot.tls.certresolver=mydnschallenge

  penpot-backend:
    image: penpotapp/backend:latest
    networks:
      - penpot
    environment:
      PENPOT_PUBLIC_URI: https://${PENPOT_HOSTNAME}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_DATABASE_URI: postgresql://${PENPOT_DB_HOST}:${PENPOT_DB_PORT}/${PENPOT_POSTGRES_DB}
      PENPOT_DATABASE_USERNAME: ${PENPOT_POSTGRES_USER}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_POSTGRES_PASSWORD}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_FLAGS: enable-login-with-oidc enable-oidc-registration
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_CLIENT_ID}
      PENPOT_OIDC_CLIENT_SECRET: ${PENPOT_OIDC_CLIENT_SECRET}
      PENPOT_OIDC_BASE_URI: ${PENPOT_OIDC_BASE_URI}
      # Don't touch it; this uses an internal docker network to
      # communicate with the admin-console.
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    volumes:
      - ${HOME}/penpot/assets:/opt/data/assets
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false
  
  penpot-admin-console:
    image: penpotapp/admin-console:2.19
    networks:
      - penpot
    environment:
      PENPOT_PUBLIC_URI: https://${PENPOT_HOSTNAME}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_DATABASE_URI: postgresql://${PENPOT_DB_HOST}:${PENPOT_DB_PORT}/${PENPOT_POSTGRES_DB}?sslmode=verify-full
      PENPOT_DATABASE_USERNAME: ${PENPOT_POSTGRES_USER}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_POSTGRES_PASSWORD}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/postgres-ca.crt
      # Don't touch it; this uses an internal docker network to
      # communicate with the frontend.
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
    volumes:
      - ${HOME}/penpot/certs/postgres-ca.crt:/etc/ssl/certs/postgres-ca.crt:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

  penpot-exporter:
    image: penpotapp/exporter:latest
    networks:
      - penpot
    environment:
      PENPOT_PUBLIC_URI: https://${PENPOT_HOSTNAME}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

  penpot-valkey:
    image: valkey/valkey:8
    networks:
      - penpot
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=false

networks:
  traefik-public:
    external: true
  penpot:
    driver: overlay
