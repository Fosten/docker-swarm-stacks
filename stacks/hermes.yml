services:
  hermes:
    image: nousresearch/hermes-agent:latest
    command:
      - sh
      - -lc
      - |
        set -eu

        for profile in manager worker; do
          dir="/opt/data/profiles/$$profile"
          mkdir -p "$$dir"
          umask 077

          if [ "$$profile" = "manager" ]; then
            access_token="$${MANAGER_MATRIX_ACCESS_TOKEN}"
            allowed_users="$${MANAGER_MATRIX_ALLOWED_USERS}"
            device_id="$${MANAGER_MATRIX_DEVICE_ID}"
            home_room="$${MANAGER_MATRIX_HOME_ROOM}"
          else
            access_token="$${WORKER_MATRIX_ACCESS_TOKEN}"
            allowed_users="$${WORKER_MATRIX_ALLOWED_USERS}"
            device_id="$${WORKER_MATRIX_DEVICE_ID}"
            home_room="$${WORKER_MATRIX_HOME_ROOM}"
          fi

          {
            printf 'MATRIX_HOMESERVER=%s\n' "$$MATRIX_HOMESERVER"
            printf 'MATRIX_ACCESS_TOKEN=%s\n' "$$access_token"
            printf 'MATRIX_ALLOWED_USERS=%s\n' "$$allowed_users"
            printf 'MATRIX_DEVICE_ID=%s\n' "$$device_id"
            printf 'MATRIX_HOME_ROOM=%s\n' "$$home_room"
          } > "$$dir/.env"

          chmod 600 "$$dir/.env"
        done

        exec hermes gateway

    volumes:
      - ${HOME}/.hermes/gateway:/opt/data
    networks:
      - traefik-public
      - ai-net
    environment:
      HERMES_UID: ${HERMES_UID}
      HERMES_GID: ${HERMES_GID}
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      HERMES_DASHBOARD_BASIC_AUTH_SESSION_TTL_SECONDS: 3600
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_HOSTNAME}
      OPENROUTER_API_KEY: ${HERMES_OPENROUTER_API_KEY}
      MATRIX_HOMESERVER: ${HERMES_MATRIX_HOMESERVER}
      MANAGER_MATRIX_ACCESS_TOKEN: ${MANAGER_MATRIX_ACCESS_TOKEN}
      MANAGER_MATRIX_ALLOWED_USERS: ${MANAGER_MATRIX_ALLOWED_USERS}
      MANAGER_MATRIX_DEVICE_ID: ${MANAGER_MATRIX_DEVICE_ID}
      MANAGER_MATRIX_HOME_ROOM: ${MANAGER_MATRIX_HOME_ROOM}
      WORKER_MATRIX_ACCESS_TOKEN: ${WORKER_MATRIX_ACCESS_TOKEN}
      WORKER_MATRIX_ALLOWED_USERS: ${WORKER_MATRIX_ALLOWED_USERS}
      WORKER_MATRIX_DEVICE_ID: ${WORKER_MATRIX_DEVICE_ID}
      WORKER_MATRIX_HOME_ROOM: ${WORKER_MATRIX_HOME_ROOM}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.hermes.rule=Host(`${HERMES_HOSTNAME}`)
        - traefik.http.services.hermes.loadbalancer.server.port=9119
        - traefik.http.routers.hermes.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.hermes.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.hermes.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
  ai-net:
    external: true
