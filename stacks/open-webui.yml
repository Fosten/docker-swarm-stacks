services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    networks:
      - traefik-public
      - ai-net
    environment:
      DEFAULT_MODELS: ${OPEN_WEBUI_DEFAULT_MODELS}
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://llama-cpp-8gb:8080/v1;http://llama-cpp-16gb:8080/v1"
      OPENAI_API_CONFIGS: '{"0":{"enable":true,"prefix_id":"llama-cpp-8gb","provider":"llama.cpp","auth_type":"none"},"1":{"enable":true,"prefix_id":"llama-cpp-16gb","provider":"llama.cpp","auth_type":"none"}}'
      WEBUI_ADMIN_EMAIL: ${OPEN_WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${OPEN_WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_NAME: ${OPEN_WEBUI_ADMIN_NAME}
      ENABLE_SIGNUP: "false"
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      ENABLE_PERSISTENT_CONFIG: "false"
    volumes:
      - ${HOME}/open-webui:/app/backend/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.open-webui.rule=Host(`${OPEN_WEBUI_HOSTNAME}`)
        - traefik.http.services.open-webui.loadbalancer.server.port=8080
        - traefik.http.routers.open-webui.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.open-webui.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.open-webui.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
  ai-net:
    external: true
