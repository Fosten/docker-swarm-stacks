version: '3.9'

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    networks:
      - traefik-public
    command: serve
    volumes:
      - ${HOME}/ntfy/ntfy_cache:/var/cache/ntfy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ${STACK_PARAM}
      labels:
        - traefik.enable=true
        - traefik.http.routers.ntfy.rule=Host(`${NTFY_HOSTNAME}`)
        - traefik.http.services.ntfy.loadbalancer.server.port=80
        - traefik.http.routers.ntfy.entrypoints=${TRAEFIK_ENTRYPOINT}
        - traefik.http.routers.ntfy.tls=${TRAEFIK_TLS_ENABLED}
        - traefik.http.routers.ntfy.tls.certresolver=mydnschallenge

networks:
  traefik-public:
    external: true
