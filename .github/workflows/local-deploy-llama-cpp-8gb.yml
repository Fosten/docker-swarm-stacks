name: Local Deploy Llama.cpp 8GB CD

on:
  push:
    branches:
      - main
    paths:
      - "stacks/llama-cpp-8gb.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ vars.LOCAL_ENV }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Deploy to cluster
        uses: kitconcept/docker-stack-deploy@v1.6.0
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_private_key: ${{ secrets.DEPLOY_SSH }}
          stack_file: stacks/llama-cpp-8gb.yml
          stack_name: llama-cpp-8gb
          stack_param: ${{ secrets.LLAMA_8GB_NODE_LABEL }}
          env_file: ${{ secrets.ENV_FILE }}
          deploy_timeout: 480
