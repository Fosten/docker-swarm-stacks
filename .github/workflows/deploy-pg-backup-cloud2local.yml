name: Deploy PG Backup Cloud2Local CD

on:
#  push:
#    branches:
#      - main
#    paths:
#      - "backups/pg-backup-cloud-db.yml"
#      - "backups/pg-backup-cloud-db.sh"
#    schedule:
#      - cron: '0 2 * * 0'
#        timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ vars.LOCAL_ENV }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Deploy to cluster
        uses: kitconcept/docker-stack-deploy@v1.6.0
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_private_key: ${{ secrets.DEPLOY_SSH }}
          stack_file: backups/pg-backup-cloud-db.yml
          stack_name: pg-backup-cloud
          stack_param: ${{ secrets.OBSERV_NODE_LABEL }}
          env_file: ${{ secrets.ENV_FILE }}
          deploy_timeout: 480
